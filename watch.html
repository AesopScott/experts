  </style>

<body class="watch-page">
  <div id="site-nav"></div>
  <script src="assets/site-nav.js?v=20260802-posted-date"></script>

  <main class="watch-shell">
    <div class="watch-top">
      <a class="back-link" href="videos.html">← Back to videos</a>
      <a class="learn-banner" href="https://mojoaistudio.com/learn" target="_blank" rel="noopener noreferrer" aria-label="Open Mojo AI Studio Learn">
        <span class="learn-copy">
          <span class="learn-kicker">Mojo AI Studio</span>
          <span class="learn-title">Learn the systems behind the signal.</span>
          <span class="learn-subtitle">Practical AI learning paths for leaders, builders, and operators.</span>
        </span>
        <span class="learn-cta">Explore Learn</span>
      </a>
    </div>
    <div id="watch-root" class="loading">Loading video...</div>
  </main>

  <footer>
    <span>25experts</span>
    <span>Watch on 25experts, engage with creators on YouTube.</span>
  </footer>

  <script type="module">
    import { db } from "./assets/firebase-init.js";
    import { collection, doc, getDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const root = document.getElementById("watch-root");
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("v") || params.get("videoId") || "";
    const LOCAL_PROFILE_KEY = "25experts.localProfile.v1";

    function safeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadLocalProfile() {
      try {
        const stored = JSON.parse(localStorage.getItem(LOCAL_PROFILE_KEY) || "{}");
        return {
          favoriteChannels: Array.isArray(stored.favoriteChannels) ? stored.favoriteChannels : [],
          notes: stored.notes && typeof stored.notes === "object" ? stored.notes : {},
        };
      } catch {
        return { favoriteChannels: [], notes: {} };
      }
    }

    function saveLocalProfile(profile) {
      profile.updatedAt = new Date().toISOString();
      localStorage.setItem(LOCAL_PROFILE_KEY, JSON.stringify(profile));
    }

    function normalizeChannelName(channelName) {
      return String(channelName || "").trim();
    }

    function isFavoriteChannel(profile, channelName) {
      return profile.favoriteChannels.includes(normalizeChannelName(channelName));
    }

    function toggleFavoriteChannel(channelName) {
      const profile = loadLocalProfile();
      const channel = normalizeChannelName(channelName);
      const favorites = new Set(profile.favoriteChannels);
      if (favorites.has(channel)) favorites.delete(channel);
      else favorites.add(channel);
      profile.favoriteChannels = [...favorites].sort((a, b) => a.localeCompare(b));
      saveLocalProfile(profile);
      updateFavoriteButton(channel);
    }

    function updateFavoriteButton(channelName) {
      const button = document.querySelector("[data-favorite-channel]");
      if (!button) return;
      const profile = loadLocalProfile();
      const favorite = isFavoriteChannel(profile, channelName);
      button.classList.toggle("is-favorite", favorite);
      button.setAttribute("aria-pressed", favorite ? "true" : "false");
      button.textContent = favorite ? "♥ Favorited channel" : "♡ Favorite channel";
    }

    function coercePublishedDate(value) {
      if (!value) return null;
      if (typeof value.toDate === "function") return value.toDate();
      if (typeof value === "object" && Number.isFinite(value.seconds)) return new Date(value.seconds * 1000);
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatPostedDate(value) {
      const date = coercePublishedDate(value);
      if (!date) return "";
      return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" }).format(date);
    }

    function cleanSummaryText(value) {
      return String(value || "")
        .replace(/full\s+post\s*:?.*?(?=(?:\s+[A-Z][a-z]+(?:\s+[a-z]+)*\s*:)|$)/gi, " ")
        .replace(/https?:\/\/\S+/gi, " ")
        .replace(/\b[\w.-]+\.(?:com|net|org|io|ai|co|newsletter)\S*/gi, " ")
        .replace(/\b(?:utm_[a-z_]+|showWelcomeOnShare|r)=[^\s]+/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function youtubeUrl(id) {
      return `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
    }

    function embedUrl(id) {
      return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1&playsinline=1`;
    }

    function commentsUrl(id) {
      return `${youtubeUrl(id)}#comments`;
    }

    async function loadVideo() {
      if (!videoId) {
        root.className = "error";
        root.textContent = "No video was selected.";
        return;
      }

      const videoSnap = await getDoc(doc(db, "curatedVideos", videoId));
      if (!videoSnap.exists()) {
        root.className = "error";
        root.textContent = "This video was not found in the curated library.";
        return;
      }

      const video = { id: videoSnap.id, ...videoSnap.data() };
      const summary = cleanSummaryText(video.transcriptSummary || "");
      const related = await loadRelated(video);
      renderWatchPage(video, summary, related);
    }

    async function loadRelated(video) {
      const snap = await getDocs(query(collection(db, "curatedVideos"), orderBy("publishedAt", "desc"), limit(120)));
      return snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(item => item.id !== video.id && item.channelName === video.channelName)
        .slice(0, 4);
    }

    function renderRelated(items) {
      if (!items.length) return `<p>No related videos from this channel are loaded yet.</p>`;
      return `<div class="related-list">${items.map(item => `
        <a class="related-item" href="watch.html?v=${encodeURIComponent(item.id)}">
          <img src="${safeHtml(item.thumbnail)}" alt="" loading="lazy">
          <span>
            <span class="related-title">${safeHtml(item.title)}</span>
            <span class="related-meta">${safeHtml(formatPostedDate(item.publishedAt))}</span>
          </span>
        </a>
      `).join("")}</div>`;
    }

    function renderWatchPage(video, summary, related) {
      const profile = loadLocalProfile();
      const source = video.link || youtubeUrl(video.id);
      const posted = formatPostedDate(video.publishedAt);
      const favorite = isFavoriteChannel(profile, video.channelName);
      document.title = `${video.title || "Watch AI Video"} | 25experts`;

      root.className = "watch-layout";
      root.innerHTML = `
        <section class="player-card">
          <div class="player-frame">
            <iframe
              src="${embedUrl(video.id)}"
              title="${safeHtml(video.title)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
          </div>
          <div class="video-meta">
            <span class="kicker">Curated video</span>
            <h1>${safeHtml(video.title)}</h1>
            <div class="channel-row">
              <span>${safeHtml(video.channelName)}</span>
              ${posted ? `<span>Posted ${safeHtml(posted)}</span>` : ""}
            </div>
            <div class="actions">
              <a class="button" href="${safeHtml(source)}" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
              <a class="button secondary" href="${safeHtml(commentsUrl(video.id))}" target="_blank" rel="noopener noreferrer">Comment on YouTube</a>
              <button class="button secondary${favorite ? " is-favorite" : ""}" type="button" data-favorite-channel="${safeHtml(video.channelName)}" aria-pressed="${favorite ? "true" : "false"}">${favorite ? "♥ Favorited channel" : "♡ Favorite channel"}</button>
            </div>
          </div>
        </section>

        <aside class="side-stack">
          <section class="context-card">
            <h2>Synopsis</h2>
            <div class="summary">${safeHtml(summary || "A transcript summary is not available for this video yet.")}</div>
          </section>

          <a class="ad-card" href="https://mojoaisummits.com/ai-executive-readiness-online/" target="_blank" rel="noopener noreferrer" aria-label="AI Executive Readiness, September 4 2026, virtual">
            <img class="summit-logo" src="assets/mojo-ai-summits-circle.png" alt="" aria-hidden="true" loading="lazy">
            <div class="ad-label">Mojo AI Summits</div>
            <svg class="summit-icon" viewBox="0 0 180 150" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="16" y="18" width="148" height="92" rx="7"></rect>
              <path d="M76 110l-13 28h54l-13-28"></path>
              <path d="M45 55l14 14 31-34"></path>
              <path d="M45 83l14 14 31-34"></path>
