  <style>
    :root {
      --navy:#0A0F1E;
      --blue:#1666FF;
      --cyan:#00E6FF;
      --slate:#1B2333;
      --white:#FFFFFF;
      --soft:#EAF7FF;
      --surface:#F7FBFF;
      --line:rgba(22,102,255,.18);
      --muted:#5E6C84;
      --shadow:0 22px 70px rgba(10,15,30,.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(112deg, rgba(10,15,30,.06), rgba(22,102,255,.08)),
        repeating-linear-gradient(108deg, rgba(22,102,255,.11) 0 1px, transparent 1px 72px),
        #eef3f8;
      color: var(--navy);
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      letter-spacing: 0;
    }
    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
    .watch-shell {
      width: min(1480px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0 76px;
    }
    .watch-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--blue);
      font-weight: 850;
      box-shadow: 0 10px 30px rgba(10,15,30,.08);
    }
    .watch-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 390px);
      gap: 18px;
      align-items: start;
    }
    .player-card,
    .context-card,
    .ad-card,
    .related-card,
    .notes-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .player-card { overflow: hidden; }
    .player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--navy);
    }
    .player-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-meta {
      padding: 22px;
      display: grid;
      gap: 14px;
    }
    .kicker {
      width: max-content;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--blue);
      font-size: 12px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(32px, 4vw, 58px);
      line-height: 1;
      letter-spacing: 0;
    }
    .channel-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--blue);
      font-weight: 850;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--blue);
      color: var(--white);
      font-weight: 900;
      cursor: pointer;
    }
    .button.secondary {
      background: var(--surface);
      color: var(--blue);
      border-color: var(--line);
    }
    .button.is-favorite {
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.34);
    }
    .side-stack {
      display: grid;
      gap: 14px;
    }
    .context-card,
    .ad-card,
    .related-card,
    .notes-card {
      padding: 18px;
    }
    .context-card h2,
    .ad-card h2,
    .related-card h2,
    .notes-card h2 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 24px;
      line-height: 1.1;
    }
    .context-card p,
    .ad-card p,
    .related-card p,
    .notes-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .summary {
      margin-top: 12px;
      color: var(--navy);
      font-size: 15px;
      line-height: 1.62;
      white-space: pre-wrap;
    }
    .ad-card {
      background: linear-gradient(145deg, var(--navy), var(--slate));
      color: var(--white);
    }
    .ad-card h2,
    .ad-card p { color: var(--white); }
    .ad-card p { opacity: .78; }
    .ad-label {
      margin-bottom: 10px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--navy);
      resize: vertical;
    }
    .note-status {
      min-height: 18px;
      margin-top: 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
    }
    .related-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .related-item {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
    }
    .related-item img {
      width: 92px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      background: var(--navy);
    }
    .related-title {
      display: block;
      color: var(--navy);
      font-size: 13px;
      font-weight: 850;
      line-height: 1.25;
    }
    .related-meta {
      display: block;
      margin-top: 5px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }
    .loading,
    .error {
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--blue);
      font-weight: 850;
      box-shadow: var(--shadow);
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding: 24px clamp(18px,5vw,68px);
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 980px) {
      .watch-layout { grid-template-columns: 1fr; }
      .watch-top { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 540px) {
      .watch-shell { width: min(100% - 24px, 1480px); padding-top: 22px; }
      .video-meta,
      .context-card,
      .ad-card,
      .related-card,
      .notes-card { padding: 14px; }
      .actions { display: grid; }
      .button { width: 100%; }
      .related-item { grid-template-columns: 76px 1fr; }
      .related-item img { width: 76px; }
    }
  </style>

<body class="watch-page">
  <div id="site-nav"></div>
  <script src="assets/site-nav.js?v=20260802-posted-date"></script>

  <main class="watch-shell">
    <div class="watch-top">
      <a class="back-link" href="videos.html">← Back to videos</a>
      <span class="kicker">Creator-friendly watch page</span>
    </div>
    <div id="watch-root" class="loading">Loading video...</div>
  </main>

  <footer>
    <span>25experts</span>
    <span>Watch on 25experts, engage with creators on YouTube.</span>
  </footer>

  <script type="module">
    import { db } from "./assets/firebase-init.js";
    import { collection, doc, getDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const root = document.getElementById("watch-root");
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("v") || params.get("videoId") || "";
    const LOCAL_PROFILE_KEY = "25experts.localProfile.v1";

    function safeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadLocalProfile() {
      try {
        const stored = JSON.parse(localStorage.getItem(LOCAL_PROFILE_KEY) || "{}");
        return {
          favoriteChannels: Array.isArray(stored.favoriteChannels) ? stored.favoriteChannels : [],
          notes: stored.notes && typeof stored.notes === "object" ? stored.notes : {},
        };
      } catch {
        return { favoriteChannels: [], notes: {} };
      }
    }

    function saveLocalProfile(profile) {
      profile.updatedAt = new Date().toISOString();
      localStorage.setItem(LOCAL_PROFILE_KEY, JSON.stringify(profile));
    }

    function normalizeChannelName(channelName) {
      return String(channelName || "").trim();
    }

    function isFavoriteChannel(profile, channelName) {
      return profile.favoriteChannels.includes(normalizeChannelName(channelName));
    }

    function toggleFavoriteChannel(channelName) {
      const profile = loadLocalProfile();
      const channel = normalizeChannelName(channelName);
      const favorites = new Set(profile.favoriteChannels);
      if (favorites.has(channel)) favorites.delete(channel);
      else favorites.add(channel);
      profile.favoriteChannels = [...favorites].sort((a, b) => a.localeCompare(b));
      saveLocalProfile(profile);
      updateFavoriteButton(channel);
    }

    function updateFavoriteButton(channelName) {
      const button = document.querySelector("[data-favorite-channel]");
      if (!button) return;
      const profile = loadLocalProfile();
      const favorite = isFavoriteChannel(profile, channelName);
      button.classList.toggle("is-favorite", favorite);
      button.setAttribute("aria-pressed", favorite ? "true" : "false");
      button.textContent = favorite ? "♥ Favorited channel" : "♡ Favorite channel";
    }

    function coercePublishedDate(value) {
      if (!value) return null;
      if (typeof value.toDate === "function") return value.toDate();
      if (typeof value === "object" && Number.isFinite(value.seconds)) return new Date(value.seconds * 1000);
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatPostedDate(value) {
      const date = coercePublishedDate(value);
      if (!date) return "";
      return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" }).format(date);
    }

    function youtubeUrl(id) {
      return `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
    }

    function embedUrl(id) {
      return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1&playsinline=1`;
    }

    function commentsUrl(id) {
      return `${youtubeUrl(id)}#comments`;
    }

    async function loadVideo() {
      if (!videoId) {
        root.className = "error";
        root.textContent = "No video was selected.";
        return;
      }

      const videoSnap = await getDoc(doc(db, "curatedVideos", videoId));
      if (!videoSnap.exists()) {
        root.className = "error";
        root.textContent = "This video was not found in the curated library.";
        return;
      }

      const video = { id: videoSnap.id, ...videoSnap.data() };
      const transcriptSnap = await getDoc(doc(db, "videoTranscripts", video.id));
      const transcriptRecord = transcriptSnap.exists() ? transcriptSnap.data() : {};
      const summary = transcriptRecord.summary || video.transcriptSummary || "";
      const related = await loadRelated(video);
      renderWatchPage(video, summary, related);
    }

    async function loadRelated(video) {
      const snap = await getDocs(query(collection(db, "curatedVideos"), orderBy("publishedAt", "desc"), limit(120)));
      return snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(item => item.id !== video.id && item.channelName === video.channelName)
        .slice(0, 4);
    }

    function renderRelated(items) {
      if (!items.length) return `<p>No related videos from this channel are loaded yet.</p>`;
      return `<div class="related-list">${items.map(item => `
        <a class="related-item" href="watch.html?v=${encodeURIComponent(item.id)}">
          <img src="${safeHtml(item.thumbnail)}" alt="" loading="lazy">
          <span>
            <span class="related-title">${safeHtml(item.title)}</span>
            <span class="related-meta">${safeHtml(formatPostedDate(item.publishedAt))}</span>
          </span>
        </a>
      `).join("")}</div>`;
    }

    function renderWatchPage(video, summary, related) {
      const profile = loadLocalProfile();
      const notes = profile.notes?.[video.id] || "";
      const source = video.link || youtubeUrl(video.id);
      const posted = formatPostedDate(video.publishedAt);
      const favorite = isFavoriteChannel(profile, video.channelName);
      document.title = `${video.title || "Watch AI Video"} | 25experts`;

      root.className = "watch-layout";
      root.innerHTML = `
        <section class="player-card">
          <div class="player-frame">
            <iframe
              src="${embedUrl(video.id)}"
              title="${safeHtml(video.title)}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
          </div>
          <div class="video-meta">
            <span class="kicker">Curated video</span>
            <h1>${safeHtml(video.title)}</h1>
            <div class="channel-row">
              <span>${safeHtml(video.channelName)}</span>
              ${posted ? `<span>Posted ${safeHtml(posted)}</span>` : ""}
            </div>
            <div class="actions">
              <a class="button" href="${safeHtml(source)}" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
              <a class="button secondary" href="${safeHtml(commentsUrl(video.id))}" target="_blank" rel="noopener noreferrer">Comment on YouTube</a>
              <button class="button secondary${favorite ? " is-favorite" : ""}" type="button" data-favorite-channel="${safeHtml(video.channelName)}" aria-pressed="${favorite ? "true" : "false"}">${favorite ? "♥ Favorited channel" : "♡ Favorite channel"}</button>
            </div>
          </div>
        </section>

        <aside class="side-stack">
          <section class="context-card">
            <div class="kicker">Mojo context</div>
            <h2>Synopsis</h2>
            <p>This summary is generated from the transcript so viewers can decide how to follow up without replacing the creator's original discussion.</p>
            <div class="summary">${safeHtml(summary || "A transcript summary is not available for this video yet.")}</div>
          </section>

          <section class="ad-card">
            <div class="ad-label">Sponsor space</div>
            <h2>Marketing slot</h2>
            <p>Use this rail for Mojo AI Studio offers, sponsor placements, lead magnets, newsletters, product demos, or creator-friendly promotions.</p>
          </section>

          <section class="notes-card">
            <div class="kicker">Private layer</div>
            <h2>Your notes</h2>
            <p>Saved locally on this machine. Public comments stay with the creator on YouTube.</p>
            <textarea id="viewer-notes" placeholder="Capture follow-up ideas, tools mentioned, or questions to ask later.">${safeHtml(notes)}</textarea>
            <div class="note-status" id="note-status"></div>
          </section>

          <section class="related-card">
            <div class="kicker">Same creator</div>
            <h2>Related videos</h2>
            ${renderRelated(related)}
          </section>
        </aside>
      `;

      document.querySelector("[data-favorite-channel]").addEventListener("click", () => {
        toggleFavoriteChannel(video.channelName);
      });

      const notesEl = document.getElementById("viewer-notes");
      const statusEl = document.getElementById("note-status");
      let timer = null;
      notesEl.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const nextProfile = loadLocalProfile();
          nextProfile.notes = nextProfile.notes || {};
          nextProfile.notes[video.id] = notesEl.value;
          saveLocalProfile(nextProfile);
          statusEl.textContent = "Notes saved locally.";
          setTimeout(() => { statusEl.textContent = ""; }, 1800);
        }, 250);
      });
    }

    loadVideo().catch(err => {
      console.error("Failed to load watch page:", err);
      root.className = "error";
      root.textContent = "Failed to load this video. Please go back to the video library and try again.";
    });
  </script>
</body>
