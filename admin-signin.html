<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Sign In | 25experts</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 360px; box-shadow: 0 2px 16px rgba(0,0,0,.1); }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 24px; color: #666; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 16px; }
    button { width: 100%; padding: 12px; background: #145f47; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #error { color: #c0392b; font-size: 14px; margin-top: 12px; display: none; }
    #success { color: #145f47; font-size: 14px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Sign In</h1>
    <p>Internal tool — not publicly linked.</p>
    <form id="form">
      <label for="email">Email</label>
      <input type="email" id="email" value="ravenshroud@gmail.com" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="btn">Sign in</button>
      <div id="error"></div>
      <div id="success"></div>
    </form>
  </div>

  <script type="module">
    import { auth } from './assets/firebase-init.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    // Already signed in → go straight to admin
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'admin.html';
    });

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn');
      const errorEl  = document.getElementById('error');
      const successEl = document.getElementById('success');

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errorEl.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        successEl.textContent = 'Signed in — redirecting to admin…';
        successEl.style.display = 'block';
      } catch (err) {
        const map = {
          'auth/invalid-credential': 'Wrong email or password.',
          'auth/user-not-found':     'No account found for that email.',
          'auth/wrong-password':     'Wrong password.',
          'auth/too-many-requests':  'Too many attempts — wait a moment and try again.',
          'auth/network-request-failed': 'Network error — check your connection.',
        };
        errorEl.textContent = map[err.code] || `Error: ${err.code}`;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
