<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | 25experts</title>
  <meta name="page-version" content="v2026.05.23.1">
  <meta name="page-updated" content="2026-05-23">
  <meta name="version-policy" content="Update page-version and page-updated on every content, design, SEO, or behavior change.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#145f47">
  <style>
    :root {
      --ink: #101615;
      --muted: #66716e;
      --paper: #fbfaf6;
      --panel: #ffffff;
      --line: #dfe5df;
      --green: #145f47;
      --mint: #e9f5ef;
      --gold: #b87a22;
      --gold2: #fff1d8;
      --red: #c0392b;
      --red2: #fef2f2;
      --shadow: 0 18px 46px rgba(17,31,25,.1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.45; }
    a { color: inherit; text-decoration: none; }
    h2, h3, p { margin-top: 0; }
    button { font: inherit; }

    .topbar { padding: 9px 18px; background: var(--green); color: #fff; font-size: 13px; text-align: center; font-weight: 650; }

    .admin-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px clamp(18px,4vw,56px); background: var(--panel); border-bottom: 1px solid var(--line); }
    .admin-header h1 { margin: 0; font-size: 20px; font-weight: 900; }
    .admin-header span { color: var(--muted); font-size: 13px; }
    .signout-btn { min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--red2); color: var(--red); font-weight: 900; font-size: 13px; cursor: pointer; }

    .page { max-width: 1360px; margin: 0 auto; padding: 28px clamp(18px,4vw,56px) 80px; display: grid; gap: 28px; }

    .section-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
    .section-head { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 17px; font-weight: 900; }
    .section-head span { color: var(--muted); font-size: 13px; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--paper); white-space: nowrap; }
    td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #fafbfa; }

    .role-badge { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: .04em; }
    .role-badge.patron          { background: #e6f0fb; color: #295b8f; }
    .role-badge.contributor     { background: var(--mint); color: var(--green); }
    .role-badge.expert          { background: var(--gold2); color: var(--gold); }
    .role-badge.founding_expert { background: #f0e8ff; color: #6b3fa0; }
    .role-badge.admin           { background: var(--red2); color: var(--red); }

    .role-select { min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; }
    .save-btn { min-height: 34px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--green); color: #fff; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; }
    .save-btn:disabled { opacity: .5; cursor: default; }
    .save-btn.saved { background: #2a6e50; }

    .status-badge { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 900; }
    .status-badge.pending { background: var(--gold2); color: var(--gold); }
    .status-badge.live    { background: var(--mint); color: var(--green); }
    .status-badge.expired { background: #f2f2f2; color: var(--muted); }

    .action-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .approve-btn { min-height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--green); color: #fff; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .reject-btn  { min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--muted); font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .featured-toggle { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .featured-toggle input { accent-color: var(--gold); width: 14px; height: 14px; }

    .empty-state { padding: 48px; text-align: center; color: var(--muted); font-size: 14px; }
    .loading-state { padding: 36px; text-align: center; color: var(--muted); font-size: 14px; }
    .access-denied { padding: 80px 24px; text-align: center; }
    .access-denied h2 { font-size: 24px; margin-bottom: 10px; }
    .access-denied p { color: var(--muted); max-width: 520px; margin: 0 auto; }
    .notice { border: 1px solid rgba(184,122,34,.24); background: var(--gold2); border-radius: 8px; padding: 14px 16px; color: #67450f; font-size: 13px; line-height: 1.55; }
    .notice code { background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 4px; font-family: monospace; }

    .text-input { min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font: inherit; font-size: 13px; width: 100%; }
    .add-row { display: flex; gap: 8px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
    .add-row .text-input { flex: 1; width: auto; }
    .channel-thumb { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .video-preview { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .video-preview-inner { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
    .video-preview-thumb { width: 160px; border-radius: 6px; flex-shrink: 0; }
    .video-preview-actions { padding: 0 16px 16px; display: flex; align-items: center; gap: 12px; }
    .save-status { font-size: 13px; color: var(--muted); }
    .add-video-body { padding: 20px 24px; display: grid; gap: 16px; }

    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 3px; }
    @media (max-width: 760px) { td, th { padding: 9px 10px; } }
  </style>
</head>
<body>

  <div class="topbar">
    <strong>25experts Admin</strong> — internal tool, not publicly linked.
  </div>

  <div class="admin-header">
    <div>
      <h1>Admin Dashboard</h1>
      <span id="admin-user-label">Checking access…</span>
    </div>
    <button class="signout-btn" id="signout-btn">Sign out</button>
  </div>

  <div id="page-root">
    <div class="loading-state">Checking access…</div>
  </div>

  <script type="module">
    import { auth, db, firebaseApp } from "./assets/firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, getDocs, doc, getDoc, updateDoc, deleteDoc, setDoc, serverTimestamp, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

    const functions = getFunctions(firebaseApp);
    const lookupChannelFn = httpsCallable(functions, "lookupChannel");
    const fetchVideoMetadataFn = httpsCallable(functions, "fetchVideoMetadata");
    const runDiscoveryNowFn = httpsCallable(functions, "runDiscoveryNow", { timeout: 310000 });

    const DOMAINS = [
      { key: "ai-automation",        label: "AI & Automation",                color: "#145f47" },
      { key: "finance-investing",    label: "AI in Finance & Investing",      color: "#b87a22" },
      { key: "marketing-growth",     label: "AI in Marketing, Sales & Growth",color: "#245a7d" },
      { key: "leadership-management",label: "AI in Leadership & Management",  color: "#bf563f" },
      { key: "design-creative-gaming",label:"AI in Design, Creative & Gaming",color: "#67508f" },
    ];
    const DOMAIN_MAP = Object.fromEntries(DOMAINS.map(d => [d.key, d]));

    function domainSelectHtml(selectedKey = "") {
      const opts = DOMAINS.map(d =>
        `<option value="${d.key}"${d.key === selectedKey ? " selected" : ""}>${d.label}</option>`
      ).join("");
      return `<select class="text-input" style="min-width:200px;padding:6px 8px;font-size:13px;">
        <option value="">— Select domain —</option>${opts}</select>`;
    }

    function safeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g,  "&lt;")
        .replace(/>/g,  "&gt;")
        .replace(/"/g,  "&quot;");
    }

    const ROLES = ["patron", "contributor", "expert", "founding_expert", "admin"];

    // Handles Firestore Timestamps, ISO strings, and numbers uniformly.
    function toMs(val) {
      if (!val) return 0;
      if (typeof val.toMillis === "function") return val.toMillis();
      return new Date(val).getTime() || 0;
    }

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "join.html";
    });

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = "join.html"; return; }
      document.getElementById("admin-user-label").textContent = user.displayName || user.email;

      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (!userSnap.exists() || userSnap.data().role !== "admin") {
        document.getElementById("page-root").innerHTML = `
          <div class="page"><div class="access-denied">
            <h2>Access denied</h2>
            <p>Your account does not have admin access. Ask an existing admin to set your role to <strong>admin</strong> in the Firebase Console → Firestore → users collection.</p>
          </div></div>`;
        return;
      }

      renderAdminPage();
    });

    async function renderAdminPage() {
      document.getElementById("page-root").innerHTML = `
        <div class="page" id="admin-page">
          <div class="notice">
            <strong>First-time setup:</strong> To grant admin to the first account, open Firebase Console → Firestore → <code>users</code> collection → find the document by UID → set <code>role</code> field to <code>"admin"</code>.
          </div>

          <div class="section-card">
            <div class="section-head"><h2>Users</h2><span id="user-count"></span></div>
            <div id="users-content"><div class="loading-state">Loading users…</div></div>
          </div>

          <div class="section-card">
            <div class="section-head"><h2>Job Postings</h2><span id="jobs-count"></span></div>
            <div id="jobs-content"><div class="loading-state">Loading jobs…</div></div>
          </div>

          <div class="section-card">
            <div class="section-head"><h2>Followed Channels</h2><span id="followed-count"></span></div>
            <div id="add-channel-form"></div>
            <div id="followed-channels-content"><div class="loading-state">Loading channels…</div></div>
          </div>

          <div class="section-card">
            <div class="section-head">
              <h2>Channel Candidates</h2>
              <span id="candidates-count"></span>
              <button id="run-discovery-btn" class="btn-secondary" style="margin-left:auto;font-size:13px;padding:6px 14px;">Run Discovery Now</button>
            </div>
            <div id="candidates-content"><div class="loading-state">Loading candidates…</div></div>
          </div>

          <div class="section-card">
            <div class="section-head"><h2>Add Video Manually</h2></div>
            <div id="add-video-content"></div>
          </div>
        </div>`;

      loadUsers();
      loadJobs();
      loadFollowedChannels();
      loadCandidateChannels();
      setupAddVideo();

      document.getElementById("run-discovery-btn").addEventListener("click", async () => {
        const btn = document.getElementById("run-discovery-btn");
        btn.disabled = true;
        btn.textContent = "Running…";
        try {
          const result = await runDiscoveryNowFn();
          const found = result.data?.found ?? 0;
          btn.textContent = found > 0 ? `Found ${found} new` : "None new";
          await loadCandidateChannels();
        } catch (err) {
          console.error(err);
          btn.textContent = "Error — see console";
        } finally {
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = "Run Discovery Now";
          }, 4000);
        }
      });
    }

    async function loadUsers() {
      const container = document.getElementById("users-content");
      try {
        const snap  = await getDocs(collection(db, "users"));
        const users = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => toMs(b.createdAt) - toMs(a.createdAt));

        document.getElementById("user-count").textContent =
          users.length + " account" + (users.length !== 1 ? "s" : "");

        if (users.length === 0) {
          container.innerHTML = `<div class="empty-state">No users yet.</div>`;
          return;
        }

        const tbody = document.createElement("tbody");
        users.forEach(u => {
          const joined   = u.createdAt ? new Date(toMs(u.createdAt)).toLocaleDateString() : "—";
          const role     = u.role || "patron";
          const options  = ROLES.map(r => `<option value="${r}"${r === role ? " selected" : ""}>${r}</option>`).join("");
          const tr       = document.createElement("tr");
          tr.innerHTML   = `
            <td>${u.displayName || "—"}</td>
            <td style="color:var(--muted);font-size:13px;">${u.email || "—"}</td>
            <td id="badge-${u.id}"><span class="role-badge ${role}">${role}</span></td>
            <td style="color:var(--muted);font-size:12px;">${joined}</td>
            <td>
              <div class="action-row">
                <select class="role-select" id="rs-${u.id}"><option value="">Change role…</option>${options}</select>
                <button class="save-btn" id="sb-${u.id}">Save</button>
              </div>
            </td>`;
          tbody.appendChild(tr);
          tr.querySelector(`#sb-${u.id}`).addEventListener("click", () => saveRole(u.id));
        });

        const table = document.createElement("table");
        table.innerHTML = `<thead><tr>
          <th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Action</th>
        </tr></thead>`;
        table.appendChild(tbody);
        container.innerHTML = "";
        container.appendChild(table);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">Failed to load users.</div>`;
      }
    }

    async function saveRole(uid) {
      const select  = document.getElementById(`rs-${uid}`);
      const btn     = document.getElementById(`sb-${uid}`);
      const newRole = select.value;
      if (!newRole) return;
      btn.disabled    = true;
      btn.textContent = "Saving…";
      try {
        await updateDoc(doc(db, "users", uid), { role: newRole });
        document.getElementById(`badge-${uid}`).innerHTML = `<span class="role-badge ${newRole}">${newRole}</span>`;
        btn.textContent = "Saved ✓";
        btn.classList.add("saved");
        setTimeout(() => { btn.textContent = "Save"; btn.classList.remove("saved"); btn.disabled = false; }, 2000);
      } catch (err) {
        console.error(err);
        btn.textContent = "Error";
        setTimeout(() => { btn.textContent = "Save"; btn.disabled = false; }, 2000);
      }
    }

    async function loadJobs() {
      const container = document.getElementById("jobs-content");
      try {
        const snap = await getDocs(collection(db, "jobs"));
        const jobs = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => {
            const order = { pending: 0, live: 1, expired: 2 };
            const oa = order[a.status] ?? 3, ob = order[b.status] ?? 3;
            if (oa !== ob) return oa - ob;
            return toMs(b.createdAt) - toMs(a.createdAt);
          });

        document.getElementById("jobs-count").textContent =
          jobs.length + " listing" + (jobs.length !== 1 ? "s" : "");

        if (jobs.length === 0) {
          container.innerHTML = `<div class="empty-state">No job submissions yet.</div>`;
          return;
        }

        const tbody = document.createElement("tbody");
        jobs.forEach(j => {
          const submitted = j.createdAt ? new Date(toMs(j.createdAt)).toLocaleDateString() : "—";
          const tr        = document.createElement("tr");
          tr.id           = `jr-${j.id}`;
          tr.innerHTML    = `
            <td style="font-weight:750;max-width:200px;">${j.title || "—"}</td>
            <td style="color:var(--muted);font-size:13px;">${j.company || "—"}</td>
            <td style="font-size:13px;">${j.domain || "—"}</td>
            <td style="font-size:13px;">${j.type || "—"}</td>
            <td id="sc-${j.id}"><span class="status-badge ${j.status || "pending"}">${j.status || "pending"}</span></td>
            <td style="color:var(--muted);font-size:12px;">${submitted}</td>
            <td id="ac-${j.id}"></td>`;
          tbody.appendChild(tr);
          renderJobActions(j);
        });

        const table = document.createElement("table");
        table.innerHTML = `<thead><tr>
          <th>Title</th><th>Company</th><th>Domain</th><th>Type</th><th>Status</th><th>Submitted</th><th>Actions</th>
        </tr></thead>`;
        table.appendChild(tbody);
        container.innerHTML = "";
        container.appendChild(table);
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">Failed to load jobs.</div>`;
      }
    }

    function renderJobActions(j) {
      const cell = document.getElementById(`ac-${j.id}`);
      if (!cell) return;
      if (j.status === "expired") {
        cell.innerHTML = `<span style="color:var(--muted);font-size:13px;">Expired</span>`;
        return;
      }
      if (j.status === "live") {
        const wrap = document.createElement("div");
        wrap.className = "action-row";
        const featLabel = document.createElement("label");
        featLabel.className = "featured-toggle";
        featLabel.innerHTML = `<input type="checkbox" ${j.featured ? "checked" : ""}> Featured`;
        const cb = featLabel.querySelector("input");
        cb.addEventListener("change", () => updateDoc(doc(db, "jobs", j.id), { featured: cb.checked }));
        const expBtn = document.createElement("button");
        expBtn.className = "reject-btn";
        expBtn.textContent = "Expire";
        expBtn.addEventListener("click", () => setJobStatus(j, "expired"));
        wrap.append(featLabel, expBtn);
        cell.innerHTML = "";
        cell.appendChild(wrap);
        return;
      }
      // pending
      const wrap = document.createElement("div");
      wrap.className = "action-row";
      const featLabel = document.createElement("label");
      featLabel.className = "featured-toggle";
      featLabel.innerHTML = `<input type="checkbox"> Featured`;
      const approveBtn = document.createElement("button");
      approveBtn.className = "approve-btn";
      approveBtn.textContent = "Approve";
      approveBtn.addEventListener("click", async () => {
        const featured = featLabel.querySelector("input").checked;
        j.featured = featured;
        await updateDoc(doc(db, "jobs", j.id), { status: "live", featured });
        j.status = "live";
        document.getElementById(`sc-${j.id}`).innerHTML = `<span class="status-badge live">live</span>`;
        renderJobActions(j);
      });
      const rejectBtn = document.createElement("button");
      rejectBtn.className = "reject-btn";
      rejectBtn.textContent = "Reject";
      rejectBtn.addEventListener("click", () => setJobStatus(j, "expired"));
      wrap.append(featLabel, approveBtn, rejectBtn);
      cell.innerHTML = "";
      cell.appendChild(wrap);
    }

    async function setJobStatus(j, status) {
      await updateDoc(doc(db, "jobs", j.id), { status });
      j.status = status;
      document.getElementById(`sc-${j.id}`).innerHTML = `<span class="status-badge ${status}">${status}</span>`;
      renderJobActions(j);
    }

    // ── Followed Channels ──────────────────────────────────────────────────────

    async function loadFollowedChannels() {
      const formSlot = document.getElementById("add-channel-form");
      const container = document.getElementById("followed-channels-content");

      formSlot.innerHTML = `
        <div class="add-row">
          <input type="url" id="channel-url-input" class="text-input" placeholder="https://youtube.com/@channelhandle or /channel/UC…">
          ${domainSelectHtml()}
          <button class="approve-btn" id="add-channel-btn">Add Channel</button>
        </div>`;
      document.getElementById("add-channel-btn").addEventListener("click", handleAddChannel);

      try {
        const snap = await getDocs(collection(db, "followedChannels"));
        const channels = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.addedAt?.toMillis() || 0) - (a.addedAt?.toMillis() || 0));

        document.getElementById("followed-count").textContent =
          channels.length + " channel" + (channels.length !== 1 ? "s" : "");

        if (channels.length === 0) {
          container.innerHTML = `<div class="empty-state">No followed channels yet. Add one above.</div>`;
          return;
        }

        // Group by domain
        const grouped = {};
        DOMAINS.forEach(d => { grouped[d.key] = []; });
        grouped["__unassigned"] = [];
        channels.forEach(ch => {
          const key = ch.domain && grouped[ch.domain] ? ch.domain : "__unassigned";
          grouped[key].push(ch);
        });

        container.innerHTML = "";
        const domainOrder = [...DOMAINS.map(d => d.key), "__unassigned"];
        domainOrder.forEach(key => {
          const list = grouped[key];
          if (list.length === 0) return;
          const domainMeta = DOMAIN_MAP[key] || { label: "Unassigned", color: "#888" };
          const section = document.createElement("div");
          section.style.cssText = "margin-bottom:20px;";
          const heading = document.createElement("h3");
          heading.textContent = domainMeta.label;
          heading.style.cssText = `font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:${domainMeta.color};margin:0 0 8px;border-bottom:2px solid ${domainMeta.color};padding-bottom:4px;`;
          section.appendChild(heading);

          const tbody = document.createElement("tbody");
          list.forEach(ch => {
            const added     = ch.addedAt       ? new Date(ch.addedAt.toMillis()).toLocaleDateString()       : "—";
            const harvested = ch.lastHarvested ? new Date(ch.lastHarvested.toMillis()).toLocaleDateString() : "never";
            const chUrl = `https://www.youtube.com/channel/${encodeURIComponent(ch.channelId)}`;
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td style="font-weight:700;"><a href="${chUrl}" target="_blank" rel="noopener" style="color:inherit;">${safeHtml(ch.channelName) || "—"} ↗</a></td>
              <td style="font-size:12px;color:var(--muted);">${added}</td>
              <td style="font-size:12px;color:var(--muted);">${harvested}</td>
              <td><select class="domain-edit-sel" style="font-size:12px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;">
                <option value="">— Unassigned —</option>
                ${DOMAINS.map(d => `<option value="${d.key}"${d.key === ch.domain ? " selected" : ""}>${d.label}</option>`).join("")}
              </select></td>
              <td><button class="reject-btn" data-id="${safeHtml(ch.id)}">Remove</button></td>`;
            tbody.appendChild(tr);
            tr.querySelector(".reject-btn").addEventListener("click", () => removeChannel(ch.id));
            tr.querySelector(".domain-edit-sel").addEventListener("change", async function() {
              const newDomain = this.value;
              await updateDoc(doc(db, "followedChannels", ch.id), { domain: newDomain });
              loadFollowedChannels();
            });
          });
          const table = document.createElement("table");
          table.innerHTML = `<thead><tr><th>Channel</th><th>Added</th><th>Last Harvested</th><th>Domain</th><th>Action</th></tr></thead>`;
          table.appendChild(tbody);
          section.appendChild(table);
          container.appendChild(section);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">Failed to load channels.</div>`;
      }
    }

    async function handleAddChannel() {
      const input     = document.getElementById("channel-url-input");
      const domainSel = document.querySelector("#add-channel-form select");
      const btn       = document.getElementById("add-channel-btn");
      const url       = input.value.trim();
      const domain    = domainSel?.value || "";
      if (!url) return;
      if (!domain) { alert("Please select a domain before adding the channel."); return; }
      btn.disabled    = true;
      btn.textContent = "Looking up…";
      try {
        const result = await lookupChannelFn({ channelUrl: url });
        const { channelId, channelName, description, subscriberCount, thumbnailUrl } = result.data;
        await setDoc(doc(db, "followedChannels", channelId), {
          channelId, channelName, description, subscriberCount, thumbnailUrl,
          domain, addedAt: serverTimestamp(), lastHarvested: null,
        });
        input.value     = "";
        domainSel.value = "";
        btn.textContent = "Added ✓";
        setTimeout(() => { btn.textContent = "Add Channel"; btn.disabled = false; }, 2000);
        loadFollowedChannels();
      } catch (err) {
        console.error(err);
        btn.textContent = "Error — " + (err.message || "try again");
        setTimeout(() => { btn.textContent = "Add Channel"; btn.disabled = false; }, 3000);
      }
    }

    async function removeChannel(docId) {
      try {
        await deleteDoc(doc(db, "followedChannels", docId));
        loadFollowedChannels();
      } catch (err) {
        console.error(err);
      }
    }

    // ── Channel Candidates ─────────────────────────────────────────────────────

    async function loadCandidateChannels() {
      const container = document.getElementById("candidates-content");
      try {
        const snap = await getDocs(query(
          collection(db, "candidateChannels"),
          where("status", "==", "pending"),
          orderBy("discoveredAt", "desc")
        ));
        const candidates = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        document.getElementById("candidates-count").textContent =
          candidates.length + " pending";

        if (candidates.length === 0) {
          container.innerHTML = `<div class="empty-state">No pending candidates. Discovery runs once daily.</div>`;
          return;
        }

        const tbody = document.createElement("tbody");
        candidates.forEach(c => {
          const discovered = c.discoveredAt ? new Date(c.discoveredAt.toMillis()).toLocaleDateString() : "—";
          const rawDesc = c.description || "";
          const desc = safeHtml(rawDesc.slice(0, 100)) + (rawDesc.length > 100 ? "…" : "");
          const tr = document.createElement("tr");
          tr.id = `cr-${c.id}`;
          const channelUrl = `https://www.youtube.com/channel/${encodeURIComponent(c.channelId)}`;
          tr.innerHTML = `
            <td style="font-weight:700;"><a href="${channelUrl}" target="_blank" rel="noopener" style="color:inherit;">${safeHtml(c.channelName) || "—"} ↗</a></td>
            <td style="font-size:12px;color:var(--muted);max-width:280px;">${desc}</td>
            <td style="font-size:12px;color:var(--muted);">${discovered}</td>
            <td id="ca-${c.id}"></td>`;
          tbody.appendChild(tr);
        });

        const table = document.createElement("table");
        table.innerHTML = `<thead><tr><th>Channel</th><th>Description</th><th>Discovered</th><th>Actions</th></tr></thead>`;
        table.appendChild(tbody);
        container.innerHTML = "";
        container.appendChild(table);
        // Render action buttons AFTER table is in the DOM so getElementById resolves
        candidates.forEach(c => renderCandidateActions(c));
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">Failed to load candidates.</div>`;
      }
    }

    function renderCandidateActions(c) {
      const cell = document.getElementById(`ca-${c.id}`);
      if (!cell) return;
      const wrap = document.createElement("div");
      wrap.className = "action-row";

      // Inline domain picker for approval — pre-select engine suggestion if present
      const domainSel = document.createElement("select");
      domainSel.style.cssText = "font-size:12px;padding:3px 6px;border:1px solid #ddd;border-radius:6px;margin-right:4px;";
      domainSel.innerHTML = `<option value="">— Domain —</option>` +
        DOMAINS.map(d => `<option value="${d.key}"${d.key === c.suggestedDomain ? " selected" : ""}>${d.label}${d.key === c.suggestedDomain ? " ✦" : ""}</option>`).join("");

      const approveBtn = document.createElement("button");
      approveBtn.className  = "approve-btn";
      approveBtn.textContent = "Approve";
      approveBtn.addEventListener("click", async () => {
        const domain = domainSel.value;
        if (!domain) { alert("Select a domain before approving."); return; }
        approveBtn.disabled = true;
        approveBtn.textContent = "Saving…";
        await setDoc(doc(db, "followedChannels", c.channelId), {
          channelId: c.channelId, channelName: c.channelName,
          description: c.description, thumbnailUrl: c.thumbnailUrl,
          domain, addedAt: serverTimestamp(), lastHarvested: null,
        });
        await updateDoc(doc(db, "candidateChannels", c.id), { status: "approved" });
        document.getElementById(`cr-${c.id}`)?.remove();
        loadFollowedChannels();
      });
      wrap.appendChild(domainSel);

      const rejectBtn = document.createElement("button");
      rejectBtn.className   = "reject-btn";
      rejectBtn.textContent = "Reject";
      rejectBtn.addEventListener("click", async () => {
        await updateDoc(doc(db, "candidateChannels", c.id), { status: "rejected" });
        document.getElementById(`cr-${c.id}`)?.remove();
      });

      wrap.append(approveBtn, rejectBtn);
      cell.appendChild(wrap);
    }

    // ── Add Video Manually ─────────────────────────────────────────────────────

    function setupAddVideo() {
      const panel = document.getElementById("add-video-content");
      panel.innerHTML = `
        <div class="add-video-body">
          <div class="add-row" style="padding:0;">
            <input type="url" id="video-url-input" class="text-input" placeholder="https://youtube.com/watch?v=… or youtu.be/…">
            <button class="approve-btn" id="fetch-video-btn">Fetch Metadata</button>
          </div>
          <div id="video-preview" class="video-preview" style="display:none;">
            <div class="video-preview-inner">
              <img id="video-thumb" class="video-preview-thumb" src="" alt="">
              <div style="flex:1;">
                <p id="video-title" style="font-weight:800;margin:0 0 8px;font-size:15px;line-height:1.3;"></p>
                <p id="video-channel" style="color:var(--muted);font-size:13px;margin:0 0 4px;"></p>
                <p id="video-published" style="color:var(--muted);font-size:12px;margin:0;"></p>
              </div>
            </div>
            <div class="video-preview-actions">
              <button class="approve-btn" id="save-video-btn">Save to Library</button>
              <span id="save-status" class="save-status"></span>
            </div>
          </div>
        </div>`;

      let pendingVideo = null;

      document.getElementById("fetch-video-btn").addEventListener("click", async () => {
        const url = document.getElementById("video-url-input").value.trim();
        if (!url) return;
        const btn = document.getElementById("fetch-video-btn");
        btn.disabled    = true;
        btn.textContent = "Fetching…";
        try {
          const result  = await fetchVideoMetadataFn({ videoUrl: url });
          pendingVideo  = result.data;
          document.getElementById("video-thumb").src             = pendingVideo.thumbnail;
          document.getElementById("video-title").textContent     = pendingVideo.title;
          document.getElementById("video-channel").textContent   = pendingVideo.channelName;
          document.getElementById("video-published").textContent = "Published: " + new Date(pendingVideo.publishedAt).toLocaleDateString();
          document.getElementById("video-preview").style.display = "block";
          document.getElementById("save-status").textContent     = "";
          btn.textContent = "Fetch Metadata";
          btn.disabled    = false;
        } catch (err) {
          console.error(err);
          btn.textContent = "Error — try again";
          setTimeout(() => { btn.textContent = "Fetch Metadata"; btn.disabled = false; }, 3000);
        }
      });

      document.getElementById("save-video-btn").addEventListener("click", async () => {
        if (!pendingVideo) return;
        const saveBtn    = document.getElementById("save-video-btn");
        const saveStatus = document.getElementById("save-status");
        saveBtn.disabled    = true;
        saveStatus.textContent = "Saving…";
        try {
          await setDoc(doc(db, "curatedVideos", pendingVideo.videoId), {
            ...pendingVideo, addedAt: serverTimestamp(), addedManually: true,
          });
          saveStatus.textContent = "Saved ✓";
          saveStatus.style.color = "var(--green)";
          pendingVideo = null;
          setTimeout(() => {
            document.getElementById("video-preview").style.display = "none";
            document.getElementById("video-url-input").value       = "";
            saveStatus.textContent = "";
            saveBtn.disabled = false;
          }, 2000);
        } catch (err) {
          console.error(err);
          saveStatus.textContent = "Failed to save";
          saveStatus.style.color = "var(--red)";
          saveBtn.disabled = false;
        }
      });
    }
  </script>
